<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep space circular background -->
  <rect width="64" height="64" rx="16" fill="#05070c"/>
  
  <!-- Outer orbital perimeter trace -->
  <circle cx="32" cy="32" r="24" stroke="#0e2238" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="18" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Symmetrical 5-node orbital markers -->
  <circle cx="32" cy="14" r="2.2" fill="#22d3ee"/>
  <circle cx="49" cy="26" r="2.2" fill="#10b981"/>
  <circle cx="43" cy="47" r="2.2" fill="#f59e0b"/>
  <circle cx="21" cy="47" r="2.2" fill="#3b82f6"/>
  <circle cx="15" cy="26" r="2.2" fill="#e4e4e7"/>
  
  <!-- Inner core energy point -->
  <circle cx="32" cy="32" r="6" fill="#081528" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.5" fill="#22d3ee"/>
</svg>
